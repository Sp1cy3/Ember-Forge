// ---------- drawing helpers ----------
function px(c, x, y, w, h, col) {
  c.fillStyle = col;

}

// ---------- pixel-art data format (weapons and enemies) ----------
// Rows are run-length coded: "12.8o" = 12 x '.', 8 x 'o'. '.' is transparent.
// "28*<row>" repeats a row 28 times. mirror:true rows are the left half; the right half is the reversed copy.
function decodeRow(s) {
  let out = '', n = '';
  for (const ch of s) {
    if (ch >= '0' && ch <= '9') n += ch;
    else { out += ch.repeat(n ? +n : 1); n = ''; }
  }
  return out;
}
function expandRows(rows, mirror, who) {
  const out = [];
  for (const r of rows) {
    const m = r.match(/^(\d+)\*(.*)$/);
    let s = decodeRow(m ? m[2] : r);
    if (mirror) s += [...s].reverse().join('');
    for (let i = 0; i < (m ? +m[1] : 1); i++) out.push(s);
  }
  out.forEach((r, y) => { if (r.length !== out[0].length) console.warn(who + ': row ' + y + ' is ' + r.length + ' px, expected ' + out[0].length); });
  return out;
}
// Paints rows into a canvas, using the palette, or one solid colour (for flash / heat overlays).
// only: optional list of palette chars to keep (e.g. just the eyes).
function raster(rows, pal, solid, only) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      if (r[x] === '.' || (only && !only.includes(r[x]))) continue;
      g.fillStyle = solid || pal[r[x]] || '#f0f';
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}

    return { name: p.name, inherit: !!p.inherit, w: rows[0].length, h: rows.length,
             img: raster(rows, WEAPON_DATA.pal), hot: raster(rows, null, '#ff6a1a') };
  });
  // assembled preview, used on the title screen
  const w = Math.max(...parts.map(p => p.w)), h = parts.reduce((s, p) => s + p.h, 0);
  const preview = document.createElement('canvas'); preview.width = w; preview.height = h;
  let y = h;
  for (const p of parts) { y -= p.h; preview.getContext('2d').drawImage(p.img, (w - p.w) / 2, y); }
  return { id: wp.id, name: wp.name, attack: wp.attack, parts, preview,
           snap: wp.snap || 1.5, tol: wp.tol || 0, speed: wp.speed || 1, gems: wp.gems || [] };
});

function makeEnemy(e) {
  const rows = expandRows(e.rows, e.mirror, e.id);
  return Object.assign({}, e, {
    w: rows[0].length, h: rows.length, img: raster(rows, e.pal), flash: raster(rows, null, '#fff'),
    sil: raster(rows, null, '#06040a'),            // black silhouette (story intro)
    glow: raster(rows, e.pal, null, e.eyes || [])  // just the eyes
  });
}
const ENEMY_SPRITES = ENEMIES.map(makeEnemy);

// Draws an enemy standing on gy, centred on cx, optionally squashed (sx/sy) or flashing white.
function drawEnemy(e, cx, gy, sx, sy, flash) {
  const dw = Math.max(1, Math.round(e.w * sx)), dh = Math.max(1, Math.round(e.h * sy));
  ctx.drawImage(flash ? e.flash : e.img, Math.round(cx - dw / 2), Math.round(gy - dh), dw, dh);
}

let AC = null, master = null, noiseBuf = null;

  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, dur, type, vol, t0 = 0, freqEnd) {

  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

// ---------- game state ----------
let state = 'story', T = 0;   // story -> title -> building -> enchant -> showdown -> result
let titleFade = 0;             // black overlay fading out as the title appears
let stack = [], cur = null, partIdx = 0, phase = '', phaseT = 0;
let debris = [], sparks = [], popups = [], shake = 0;
let power = 0, chance = 0, won = false;
let sd = { on: false };
let lastEnemy = null;
const slain = new Set();       // ids of beasts beaten this hunt; all of them unlocks the ending
let endingDue = false;
let res = null, resultT = 0;
let autoBuild = false, cheated = false;   // cheat: the rest of the weapon forges itself, perfectly

function cheat() {
  if (state !== 'building' || autoBuild || phase === 'broken') return;
  autoBuild = cheated = true;
  sfx.blip();
  popups.push({ t: 'AUTO-FORGE!', x: 80, y: 40, col: C.accent, life: 1.2 });
}
const spr = document.createElement('canvas'); spr.width = W; spr.height = H;
const sprGlow = document.createElement('canvas'); sprGlow.width = W; sprGlow.height = H;   // rune-coloured aura

function topY() { return stack.length ? stack[stack.length - 1].y : BASE_Y; }
function prevRef() { return stack.length ? stack[stack.length - 1] : ANVIL_SLOT; }
function avgAcc() { return stack.length ? stack.reduce((s, p) => s + p.acc, 0) / stack.length : 0; }
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

function startGame() {
  stack = []; debris = []; sparks = []; popups = [];
  partIdx = 0; sd = { on: false }; res = null; en = null;
  weapon = WEAPONS[weaponIdx];
  buildSlow = frostSlow; frostSlow = 0;          // a frost rune from the last fight slows this build
  autoBuild = cheated = false;
  state = 'building';
  spawnPart();
}

function toTitle() {
  stack = []; debris = []; sparks = []; popups = [];
  sd = { on: false }; res = null; cur = null; en = null;
  state = 'title';
}

function changeWeapon(d) {
  weaponIdx = (weaponIdx + d + WEAPONS.length) % WEAPONS.length;
  weapon = WEAPONS[weaponIdx];
  sfx.blip();
}

// A part in play shows the columns [sx, sx + w) of its sprite; cuts move sx and shrink w.
function spawnPart() {
  const def = weapon.parts[partIdx];
  let sx = 0, w = def.w;
  const below = stack[stack.length - 1];
  if (def.inherit && below && below.img.width === def.w) { sx = below.sx; w = below.w; }
  const fromRight = partIdx % 2 === 1;
  cur = {
    def, img: def.img, hot: def.hot, sx, w, h: def.h,
    x: fromRight ? W - w - 3 : 3,
    y: topY() - def.h - 18,
    landY: topY() - def.h,
    dir: fromRight ? -1 : 1,
    speed: (50 + partIdx * 14) * weapon.speed * (1 - buildSlow),
    vy: 0
  };
  phase = 'slide';
}

function drop() {
  cur.x = Math.round(cur.x);
  cur.vy = 80;
  phase = 'fall';
}

// A flying piece of metal showing columns [sx, sx + w) of img.
function mkDebris(img, sx, w, x, y, vx, vy, vr) {
  return { img, sx, w, h: img.height, x, y, vx, vy, rot: 0, vr };
}

function land() {
  cur.y = cur.landY;
  const p = prevRef(), w0 = cur.w;
  let off = (cur.x + w0 / 2) - (p.x + p.w / 2);
  const reach = (p.w + w0) / 2;             // beyond this the part misses entirely
  // accuracy scale: capped so wide parts aren't free points, floored by the weapon's forgiveness
  const tol = Math.max(Math.min(reach, 12), weapon.tol);
  let acc, perfect = false;

  if (Math.abs(off) <= weapon.snap) {
    cur.x = Math.round(p.x + p.w / 2 - w0 / 2);
    acc = 1; perfect = true;
  } else {
    const cut = Math.round(Math.abs(off));
    if (Math.abs(off) >= reach || w0 - cut < 2) { shatter(); return; }
    acc = Math.max(0, 1 - Math.abs(off) / tol);
    if (off > 0) {
      debris.push(mkDebris(cur.img, cur.sx + w0 - cut, cut, cur.x + w0 - cut, cur.y, 25, -20, 0));
      cur.w = w0 - cut;
    } else {
      debris.push(mkDebris(cur.img, cur.sx, cut, cur.x, cur.y, -25, -20, 0));
      cur.x += cut; cur.sx += cut; cur.w = w0 - cut;
    }
    sfx.hiss();
  }

  stack.push({ name: cur.def.name, img: cur.img, hot: cur.hot, sx: cur.sx, x: cur.x, y: cur.y, w: cur.w, h: cur.h, acc, heat: 1 });
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h;
  spawnSparks(cx, cy, 8 + Math.round(acc * 14), ['#fff', '#ffe27a', '#ff9a3a', '#ff5a1a'], 50 + acc * 50, true);
  if (perfect) {
    sfx.ting();
    popups.push({ t: 'PERFECT!', x: cx, y: cur.y - 10, col: C.accent, life: 0.9 });
    shake = 1.5;
  } else {
    sfx.clang(acc);
    popups.push({ t: Math.round(acc * 100) + '%', x: cx, y: cur.y - 10, col: acc > 0.75 ? C.text : C.red, life: 0.9 });
    shake = 2.5;
  }
  cur = null;
  phase = 'wait';
  phaseT = partIdx === weapon.parts.length - 1 ? 0.8 : 0.35;
}

function shatter() {
  const parts = stack.map(p => ({ name: p.name, acc: p.acc }));
  parts.push({ name: cur.def.name, acc: null });
  debris.push(mkDebris(cur.img, cur.sx, cur.w, cur.x, cur.y, (Math.random() - 0.5) * 80, -40, (Math.random() - 0.5) * 10));
  stack.forEach(p => debris.push(mkDebris(p.img, p.sx, p.w, p.x, p.y,
    (Math.random() - 0.5) * 140, -80 - Math.random() * 120, (Math.random() - 0.5) * 12)));
  spawnSparks(cur.x + cur.w / 2, cur.y + cur.h, 24, ['#fff', '#ffcc33', '#ff7a1a'], 90, false);
  popups.push({ t: 'SHATTERED!', x: 80, y: 110, col: C.red, life: 1.4 });
  res = { shattered: true, won: false, power: Math.round(avgAcc() * 100), chance: 0, parts };
  stack = []; cur = null;
  phase = 'broken'; phaseT = 1.6; shake = 6;
  sfx.shatter();
}

function spawnSparks(x, y, n, cols, spd, up) {
  for (let i = 0; i < n; i++) {
    const a = up ? -Math.PI * Math.random() : Math.random() * Math.PI * 2;
    const s = spd * (0.4 + Math.random());
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, col: cols[i % cols.length] });
  }
}

function beginShowdown() {
  power = avgAcc();
  const s = spr.getContext('2d');
  s.clearRect(0, 0, W, H);
  stack.forEach(p => drawPiece(s, p.img, p.sx, p.w, p.x, p.y));
  if (en && en.gemLook) drawGems(s, en.gemLook);
  const ench = en && en.ok ? en : null;
  if (ench) {                                    // aura: the weapon's silhouette in the rune's colour
    const g = sprGlow.getContext('2d');
    g.clearRect(0, 0, W, H); g.drawImage(spr, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = ench.rune.col; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }
  const grip = stack.find(p => p.name === 'GRIP') || stack[1];
  const py0 = grip.y + grip.h / 2;
  const L = py0 - stack[stack.length - 1].y;   // grip to tip
  // Where the grip rests during the showdown, chosen so the tip reaches the foe (who stands at x = 124).
  // swing/chop: tip lands at x ~128 when rotated 1.75 rad (and the arm steps in 12 px).
  // thrust: the weapon lowers to horizontal and lunges 14 px so the tip lands at x ~118.
  const baseX = weapon.attack === 'thrust' ? 118 - L - 14 : 128 - 12 - L * Math.sin(1.75);
  // the next foe: a beast not yet slain if possible, and never the same one twice in a row
  let pool = ENEMY_SPRITES.filter(e => !slain.has(e.id) && e !== lastEnemy);
  if (!pool.length) pool = ENEMY_SPRITES.filter(e => !slain.has(e.id));
  if (!pool.length) pool = ENEMY_SPRITES.filter(e => e !== lastEnemy);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  lastEnemy = pick;

  // win chance: build quality squared, plus whatever the runes add
  const mods = [];
  let bonus = 0, second = 0, venomOnLoss = 0;
  if (poison > 0) { bonus += poison; mods.push({ t: 'POISONED FOE +' + pct(poison), col: '#7cff4a' }); poison = 0; }
  if (ench) {
    const r = ench.rune, v = r.vals[ench.strength];
    if (r.id === 'fire') { bonus += v; mods.push({ t: 'FIRE +' + pct(v), col: r.col }); }
    else if (r.id === 'holy') {
      if (pick.undead) { bonus += v; mods.push({ t: 'HOLY +' + pct(v) + ' VS UNDEAD', col: r.col }); }
      else mods.push({ t: 'HOLY: NO UNDEAD TO SMITE', col: C.dim });
    }
    else if (r.id === 'lightning') { second = v; mods.push({ t: 'LIGHTNING: 2ND STRIKE AT ' + pct(v), col: r.col }); }
    else if (r.id === 'frost') { frostSlow = v; mods.push({ t: 'FROST: NEXT FORGE -' + pct(v) + ' SPEED', col: r.col }); }
    else if (r.id === 'venom') { venomOnLoss = v; mods.push({ t: 'VENOM: IF YOU FALL, NEXT +' + pct(v), col: r.col }); }
  }
  chance = Math.min(1, power * power + bonus);

  sd = {
    on: true, phase: 'enter', t: 0, st: 0, ot: 0, enemy: pick, attack: weapon.attack,
    px0: grip.x + grip.w / 2, py0, baseX, L,
    dx: 0, dy: 0, ang: 0, mx: 200, mflash: 0, sq: 1, jump: 0, alive: true, resolved: false, hitT: 0,
    ench, mods, second, venomOnLoss, poisoned: false
  };
  state = 'showdown';
  sfx.whoosh();
}

function resolveStrike() {
  sd.resolved = true;
  won = Math.random() < chance;
  let zapped = false;
  if (!won && sd.second) { won = Math.random() < chance * sd.second; zapped = won; }   // lightning's second strike
  const hx = sd.mx - 12, hy = FLOOR_Y - 14, py = FLOOR_Y - sd.enemy.h - 26;
  if (won) {

    if (sd.ench) sfx.element(sd.ench.rune.id);
    popups.push({ t: zapped ? 'LIGHTNING!' : 'HIT!', x: sd.mx, y: py, col: zapped ? '#ffe03a' : C.green, life: 1 });
  } else {
    shake = 3;
    sfx.block();
    spawnSparks(hx, hy, 14, ['#fff', '#ffcc33'], 80, false);
    popups.push({ t: 'BOUNCED OFF!', x: sd.mx - 8, y: py, col: C.red, life: 1 });
    if (sd.venomOnLoss) { poison = sd.venomOnLoss; sd.poisoned = true; }    // the venom lingers for the next fight
  }
}

function toResult(didWin) {
  state = 'result'; resultT = 0;

    const before = slain.size;
    slain.add(sd.enemy.id);
    if (slain.size === ENEMY_SPRITES.length && before < slain.size) endingDue = true;
  }

    shattered: false, won: didWin,
    power: Math.round(power * 100), chance: Math.round(chance * 100), cheated,
    parts: stack.map(p => ({ name: p.name, acc: p.acc })),
    rune: sd.poisoned ? { t: 'VENOM: NEXT FOE WEAKENED', col: '#7cff4a' }
        : !en || en.skipped ? { t: 'NO RUNE', col: C.dim }
        : en.ok ? { t: 'RUNE: ' + en.rune.name + ' - ' + STRENGTH[en.strength], col: en.rune.col }
        : { t: 'RUNE CRACKED', col: '#8a8a94' }
  };
}

function rankFor(r) {
  if (r.shattered) return 'SCRAP';
  const p = r.power;
  return p >= 95 ? 'LEGENDARY' : p >= 85 ? 'MASTERWORK' : p >= 70 ? 'FINE' : p >= 50 ? 'CRUDE' : 'SCRAP';
}

// ---------- input ----------
function action() {
  if (state === 'story') storyAdvance();
  else if (state === 'title') startGame();
  else if (state === 'building' && phase === 'slide') drop();
  else if (state === 'enchant') enchantSkip();
  else if (state === 'showdown' && sd.phase === 'ready') { sd.phase = 'strike'; sd.st = 0; sfx.whoosh(); }
  else if (state === 'result' && resultT > 0.6) {
    if (endingDue) { endingDue = false; playEnding(); } else startGame();
  }
}
function press() { initAudio(); action(); }
// Left/right picks the weapon on the title screen; from the result screen it returns to the title.
function pick(d) {
  initAudio();
  if (state === 'title') changeWeapon(d);
  else if (state === 'result' && resultT > 0.6 && !endingDue) { toTitle(); changeWeapon(d); }
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); pick(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); pick(1); }
  else if (e.code === 'Escape' && state === 'story') { initAudio(); storySkip(); }
  else if (e.code === 'KeyC') { initAudio(); cheat(); }
});
// pointer position in game pixels
function gamePoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', e => { if (state === 'enchant') enchantMove(gamePoint(e)); });
cv.addEventListener('pointerup', () => { if (state === 'enchant') enchantUp(); });
cv.addEventListener('pointercancel', () => { if (state === 'enchant') enchantUp(); });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const { x, y } = gamePoint(e);
  // enchanting: pressing on the start dot begins the trace (taps elsewhere do nothing)
  if (state === 'enchant') {
    initAudio();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* keep tracing even if capture is refused */ }
    enchantDown({ x, y });
  }
  // story: tapping the "SKIP" corner skips, anywhere else advances
  else if (state === 'story' && st.begun && x > W - 44 && y < 14) { initAudio(); storySkip(); }
  // building: the "C: CHEAT" label in the bottom-left corner
  else if (state === 'building' && x < 44 && y > 222) { initAudio(); cheat(); }
  // on menus, tapping the outer thirds changes weapon; anywhere else acts like Space
  else if ((state === 'title' || state === 'result') && (x < W / 3 || x > W * 2 / 3)) pick(x < W / 3 ? -1 : 1);
  else press();
});

// ---------- update ----------
function update(dt) {
  T += dt;
  shake = Math.max(0, shake - dt * 12);
  stack.forEach(p => { p.heat = Math.max(0, p.heat - dt * 1.2); });
  titleFade = Math.max(0, titleFade - dt / 0.6);

  if (state === 'story') updateStory(dt);
  else if (state === 'building') {
    if (autoBuild && cur && (phase === 'slide' || phase === 'fall')) {
      const p = prevRef();                       // cheat: line the part up dead-centre and let it fall
      cur.x = Math.round(p.x + p.w / 2 - cur.w / 2);
      if (phase === 'slide') drop();
    }
    if (phase === 'slide') {
      cur.x += cur.dir * cur.speed * dt;
      if (cur.x < 2) { cur.x = 2; cur.dir = 1; }
      if (cur.x > W - 2 - cur.w) { cur.x = W - 2 - cur.w; cur.dir = -1; }
    } else if (phase === 'fall') {
      cur.vy += 900 * dt;
      cur.y += cur.vy * dt;
      if (cur.y >= cur.landY) land();
    } else if (phase === 'wait') {
      phaseT -= dt;
      if (phaseT <= 0) {
        partIdx++;
        if (partIdx < weapon.parts.length) spawnPart(); else beginEnchant();
      }
    } else if (phase === 'broken') {
      phaseT -= dt;
      if (phaseT <= 0) { state = 'result'; resultT = 0; }
    }
  } else if (state === 'enchant') {
    updateEnchant(dt);
  } else if (state === 'showdown') {
    updateShowdown(dt);
  } else if (state === 'result') {
    resultT += dt;
  }

  for (const d of debris) { d.vy += 500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; }
  debris = debris.filter(d => d.y < H + 40);
  for (const s of sparks) { s.vy += 200 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  for (const p of popups) { p.y -= 18 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function updateShowdown(dt) {
  sd.t += dt;
  if (sd.mflash > 0) sd.mflash -= dt;
  const baseDx = sd.baseX - sd.px0;

  if (sd.phase === 'enter') {
    const e = ease(sd.t / 0.9);
    sd.dx = baseDx * e;
    sd.mx = 200 + (124 - 200) * e;
    if (sd.t >= 0.9) { sd.phase = 'ready'; sfx.thump(); shake = 2; }
  } else if (sd.phase === 'strike') {
    sd.st += dt;
    const s = sd.st;
    if (sd.attack === 'thrust') {
      // lower to horizontal at the foe's chest height, draw back, then lunge
      sd.hitT = 0.28;
      const dropY = 208 - sd.py0;
      if (s < 0.18) {
        const e = ease(s / 0.18);
        sd.ang = 1.5708 * e; sd.dy = dropY * e; sd.dx = baseDx - 8 * e;
      } else if (s < sd.hitT) {
        sd.dx = baseDx - 8 + 22 * ease((s - 0.18) / 0.1);
      } else {
        if (!sd.resolved) resolveStrike();
        if (!won) { const e = ease((s - sd.hitT) / 0.3); sd.dx = baseDx + 14 - 24 * e; sd.ang = 1.5708 - 0.35 * e; }
      }
    } else {
      // swing (sword) or chop (axe: bigger, slower wind-up)
      const chop = sd.attack === 'chop';
      const wind = chop ? 0.2 : 0.12, back = chop ? -0.6 : -0.35;
      sd.hitT = wind + (chop ? 0.12 : 0.14);
      if (s < wind) {
        sd.ang = back * ease(s / wind);
      } else if (s < sd.hitT) {
        const e = ease((s - wind) / (sd.hitT - wind));
        sd.ang = back + (1.75 - back) * e;
        sd.dx = baseDx + 12 * e;
      } else {
        if (!sd.resolved) resolveStrike();
        if (!won) { const e = ease((s - sd.hitT) / 0.3); sd.ang = 1.75 - 2.0 * e; sd.dx = baseDx + 12 - 18 * e; }
      }
    }
    if (sd.ench && s < sd.hitT + 0.15) {          // enchanted: the tip trails rune sparks
      const r = sd.ench.rune;
      sparks.push({ x: sd.px0 + sd.dx + Math.sin(sd.ang) * sd.L, y: sd.py0 + sd.dy - Math.cos(sd.ang) * sd.L,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.35, col: Math.random() < 0.5 ? r.col : r.hi });
    }
    if (sd.resolved && s >= sd.hitT + 0.5) {
      sd.phase = 'outcome'; sd.ot = 0;
      if (!won) sfx.lose();
    }
  } else if (sd.phase === 'outcome') {
    sd.ot += dt;
    if (won) {
      if (sd.alive) {
        sd.sq = Math.max(0.12, 1 - sd.ot / 0.35);
        if (sd.ot >= 0.35) {
          sd.alive = false; shake = 4;
          spawnSparks(sd.mx, FLOOR_Y - 6, 40, sd.enemy.burst, 110, true);
          sfx.splat(); sfx.win();
        }
      }
    } else {
      sd.jump = sd.ot < 0.9 ? Math.abs(Math.sin(sd.ot * 7)) * 10 : 0;
    }
    if (sd.ot >= 1.6) toResult(won);
  }
}

// ---------- render ----------
const blink = () => Math.floor(T * 2.5) % 2 === 0;

function render() {
  if (state === 'story') { renderStory(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * shake), Math.round((Math.random() * 2 - 1) * shake));

  ctx.drawImage(bg, 0, 0);
  drawGlow();
  drawAnvil();

  if (sd.on) {
    // finished weapon, drawn as one sprite so it can swing
    ctx.save();
    ctx.translate(Math.round(sd.px0 + sd.dx), Math.round(sd.py0 + sd.dy));
    ctx.rotate(sd.ang);
    if (sd.ench) {                               // pulsing rune-coloured outline
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(T * 6);
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(sprGlow, -Math.round(sd.px0) + ox, -Math.round(sd.py0) + oy);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(spr, -Math.round(sd.px0), -Math.round(sd.py0));
    ctx.restore();
    if (sd.alive) {
      const e = sd.enemy;
      let sx = 1, sy = 1, ox = 0, oy = 0;
      if (e.idle === 'squash') { const b = Math.sin(T * 5); sy = 1 + 0.06 * b; sx = 1 - 0.04 * b; }
      else if (e.idle === 'bob') oy = Math.sin(T * 4) > 0 ? -1 : 0;
      else if (e.idle === 'float') oy = -Math.round(2 + 2 * Math.sin(T * 3));
      else if (e.idle === 'sway') ox = Math.round(1.5 * Math.sin(T * 3));
      sy *= sd.sq; sx *= 1 + (1 - sd.sq) * 0.7;      // death squash
      drawEnemy(e, sd.mx + ox, FLOOR_Y + oy - Math.round(sd.jump), sx, sy, sd.mflash > 0 && Math.floor(T * 30) % 2 === 0);
    }
  } else if (state === 'title') {
    // the chosen weapon, assembled, standing on the anvil
    const pv = weapon.preview;
    ctx.drawImage(pv, Math.round(80 - pv.width / 2), BASE_Y - pv.height);
  } else {
    for (const p of stack) {
      drawPiece(ctx, p.img, p.sx, p.w, p.x, p.y);
      if (p.heat > 0) {          // fresh from the forge: glows orange, cooling
        ctx.globalAlpha = p.heat * 0.6;
        drawPiece(ctx, p.hot, p.sx, p.w, p.x, p.y);
        ctx.globalAlpha = 1;
      }
    }
    if (cur) drawPiece(ctx, cur.img, cur.sx, cur.w, cur.x, cur.y);
    if (state === 'enchant' && en.gemLook) drawGems(ctx, en.gemLook);
  }

  for (const d of debris) {
    ctx.save();
    ctx.translate(Math.round(d.x + d.w / 2), Math.round(d.y + d.h / 2));
    ctx.rotate(d.rot);
    drawPiece(ctx, d.img, d.sx, d.w, -d.w / 2, -d.h / 2);
    ctx.restore();
  }
  for (const s of sparks) px(ctx, s.x, s.y, 1, 1, s.col);
  for (const p of popups) if (p.life > 0.25 || Math.floor(T * 20) % 2) drawText(p.t, p.x, Math.round(p.y), p.col, 1, 'center');

  drawHud();
  ctx.restore();
  if (state === 'enchant') drawEnchant();

  if ((state === 'showdown' && sd.phase === 'outcome' && !won) || (state === 'result' && !res.won)) {
    ctx.fillStyle = 'rgba(255,0,0,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  if (state === 'result') drawResult();
  if (titleFade > 0) { ctx.globalAlpha = titleFade; px(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
}

function drawHud() {
  if (state === 'title') {
    drawText('WEAPON', 80, 14, C.accent, 3, 'center');
    drawText('FORGE', 80, 34, C.text, 3, 'center');
    drawText('STACK THE PARTS OF YOUR WEAPON.', 80, 58, C.dim, 1, 'center');
    drawText('OFF-CENTER METAL GETS CUT.', 80, 66, C.dim, 1, 'center');
    drawText('A TRUER WEAPON SLAYS THE BEAST.', 80, 74, C.dim, 1, 'center');
    const nudge = Math.floor(T * 3) % 2;   // arrows twitch outward
    drawText('<', 40 - nudge, 86, C.accent);
    drawText(weapon.name, 80, 86, C.text, 1, 'center');
    drawText('>', 117 + nudge, 86, C.accent);
    if (blink()) drawText('SPACE TO FORGE', 80, 230, C.text, 1, 'center');
    return;
  }
  if (state === 'building') {
    const total = weapon.parts.length, n = Math.min(partIdx + 1, total);
    drawText('PART ' + n + '/' + total, 4, 4, C.dim);
    drawText(weapon.parts[Math.min(partIdx, total - 1)].name, 4, 12, C.accent);
    drawText('POWER', W - 4, 4, C.dim, 1, 'right');
    drawText(stack.length ? Math.round(avgAcc() * 100) + '%' : '--', W - 4, 12, C.text, 1, 'right');
    if (buildSlow) drawText('FROST -' + pct(buildSlow), W - 4, 20, RUNES[1].col, 1, 'right');
    if (autoBuild) drawText('AUTO-FORGING', 4, 230, C.accent, 1, 'left', false);
    else if (phase !== 'broken') drawText('C: CHEAT', 4, 230, C.dim, 1, 'left', false);
    if (partIdx === 0 && phase === 'slide' && blink()) drawText('SPACE TO DROP', 80, 30, C.text, 1, 'center');
    return;
  }
  if (state === 'showdown') {
    drawText('POWER ' + Math.round(power * 100) + '%', 80, 6, C.text, 1, 'center');
    drawText('WIN CHANCE ' + Math.round(chance * 100) + '%', 80, 16, C.accent, 1, 'center');
    px(ctx, 30, 25, 100, 4, '#000');
    px(ctx, 31, 26, Math.round(98 * chance), 2, chance > 0.6 ? C.green : chance > 0.3 ? C.accent : C.red);
    if (sd.alive) drawText(sd.enemy.name, Math.round(sd.mx), FLOOR_Y - sd.enemy.h - 12 - Math.round(sd.jump), sd.enemy.label, 1, 'center');
    let y = 33;
    for (const m of sd.mods) { drawText(m.t, 80, y, m.col, 1, 'center'); y += 8; }
    if (sd.phase === 'ready' && blink()) drawText('SPACE TO STRIKE', 80, y + 4, C.text, 1, 'center');
  }
}

function drawResult() {
  const r = res;
  ctx.globalAlpha = 0.92;
  px(ctx, 12, 44, 136, 140, '#120b10');
  ctx.globalAlpha = 1;
  px(ctx, 12, 44, 136, 1, C.accent); px(ctx, 12, 183, 136, 1, C.accent);
  px(ctx, 12, 44, 1, 140, C.accent); px(ctx, 147, 44, 1, 140, C.accent);

  const title = r.shattered ? 'SHATTERED' : r.won ? 'VICTORY!' : 'DEFEAT';
  drawText(title, 80, 52, r.won ? C.green : C.red, 2, 'center');
  drawText('RANK: ' + rankFor(r) + (r.cheated ? ' (CHEAT)' : ''), 80, 70, C.accent, 1, 'center');
  drawText(r.shattered ? 'THE WEAPON BROKE APART' : 'POWER ' + r.power + '%   CHANCE ' + r.chance + '%', 80, 80, C.text, 1, 'center');
  drawText('BEASTS SLAIN ' + slain.size + '/' + ENEMY_SPRITES.length, 80, 88, slain.size === ENEMY_SPRITES.length ? C.green : C.dim, 1, 'center', false);

  let y = 96;
  for (let i = 0; i < weapon.parts.length; i++) {
    const p = r.parts[i];
    const name = p ? p.name : weapon.parts[i].name;
    let val = '--', col = C.dim;
    if (p && p.acc === null) { val = 'MISS'; col = C.red; }
    else if (p) { val = p.acc === 1 ? 'PERFECT' : Math.round(p.acc * 100) + '%'; col = p.acc === 1 ? C.accent : p.acc > 0.75 ? C.text : C.red; }
    drawText(name, 22, y, p ? C.text : C.dim, 1, 'left', false);
    drawText(val, 138, y, col, 1, 'right', false);
    y += 9;
  }
  if (r.rune) drawText(r.rune.t, 80, 150, r.rune.col, 1, 'center', false);
  if (resultT > 0.6) {
    if (endingDue) {
      if (blink()) drawText('SPACE TO CONTINUE', 80, 161, C.text, 1, 'center');
      drawText('ALL BEASTS SLAIN!', 80, 172, C.green, 1, 'center', false);
    } else {
      if (blink()) drawText('SPACE TO FORGE AGAIN', 80, 161, C.text, 1, 'center');
      drawText('< > CHANGE WEAPON', 80, 172, C.dim, 1, 'center', false);
    }
  }
}

// ---------- enchanting ----------
// After the last part lands, a random rune opens in a spellbook. Trace its sigil through the 3x3 dots
// without leaving the inked path, and the rune's gem sets into the weapon. Leaving the path, letting go
// or running out of time cracks the gem (the fight still happens, unenchanted). Space skips.
// Dots are numbered 0-8, left to right, top to bottom. vals = effect at WEAK / STRONG / PERFECT.
const RUNES = [
  { id: 'fire', name: 'FIRE', col: '#ff7a2a', hi: '#ffd08a', ink: '#c0401a', path: [6, 3, 1, 5, 8],
    vals: [0.05, 0.10, 0.15], desc: ['+WIN CHANCE', 'AGAINST ANY FOE'], range: '+5 / 10 / 15%' },
  { id: 'frost', name: 'FROST', col: '#7fd8ff', hi: '#e6f8ff', ink: '#2a78b0', path: [0, 2, 6, 8],
    vals: [0.10, 0.15, 0.20], desc: ['YOUR NEXT FORGE', 'SLIDES SLOWER'], range: '-10 / 15 / 20%' },
  { id: 'lightning', name: 'LIGHTNING', col: '#ffe03a', hi: '#fff6b0', ink: '#a07a00', path: [1, 3, 5, 7],
    vals: [0.5, 0.75, 1], desc: ['A SECOND STRIKE', 'IF FIRST FAILS'], range: '50 / 75 / 100%' },
  { id: 'holy', name: 'HOLY', col: '#fff0b0', hi: '#ffffff', ink: '#a07a20', path: [1, 6, 8, 1],
    vals: [0.10, 0.20, 0.30], desc: ['SMITES THE', 'UNDEAD'], range: '+10 / 20 / 30%' },
  { id: 'venom', name: 'VENOM', col: '#7cff4a', hi: '#d8ffb0', ink: '#3a8a20', path: [2, 0, 3, 5, 8, 6],
    vals: [0.10, 0.15, 0.20], desc: ['IF YOU FALL, THE', 'NEXT FOE IS WEAK'], range: '+10 / 15 / 20%' }
];
const STRENGTH = ['WEAK', 'STRONG', 'PERFECT'];
const BOOK = { x: 6, y: 40, w: 148, h: 128 };
const GRID = { x: 93, y: 76, s: 22 };     // first dot and spacing, on the right-hand page
const PATH_HALF = 4;                       // half-width of the inked path in game pixels; leave it and the gem cracks
const TRACE_TIME = 6;                      // seconds to trace
let en = null;                             // the current enchanting attempt
let poison = 0, frostSlow = 0, buildSlow = 0;   // effects carried into the next fight / next build
const pct = v => Math.round(v * 100) + '%';

const dotPos = i => ({ x: GRID.x + (i % 3) * GRID.s, y: GRID.y + Math.floor(i / 3) * GRID.s });
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
  return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
}
function lineP(c, x0, y0, x1, y1, col, size = 1, dotted = false) {
  const n = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) {
    if (dotted && i % 2) continue;
    px(c, x0 + (x1 - x0) * i / n - (size >> 1), y0 + (y1 - y0) * i / n - (size >> 1), size, size, col);
  }
}

// Gem sockets in world coordinates, skipping any that were sliced off when the part was cut.
function gemSpots() {
  return weapon.gems.map(g => {
    const p = stack[g.part];
    if (!p || g.x < p.sx || g.x + g.w > p.sx + p.w) return null;
    return { x: p.x + g.x - p.sx, y: p.y + g.y, w: g.w, h: g.h };
  }).filter(Boolean);
}
function drawGems(c, look) {
  for (const s of gemSpots()) {
    if (look === 'cracked') { px(c, s.x, s.y, s.w, s.h, '#55525e'); px(c, s.x, s.y, 1, 1, '#24222a'); }
    else { px(c, s.x, s.y, s.w, s.h, look.col); px(c, s.x, s.y, 1, 1, look.hi); }
  }
}

function beginEnchant() {
  const rune = RUNES[Math.floor(Math.random() * RUNES.length)];
  // the inked path, drawn once so its translucent fill doesn't darken where strokes overlap
  const band = document.createElement('canvas'); band.width = W; band.height = H;
  const g = band.getContext('2d');
  for (let i = 0; i < rune.path.length - 1; i++) {
    const a = dotPos(rune.path[i]), b = dotPos(rune.path[i + 1]), n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y));
    for (let k = 0; k <= n; k++) disc(g, Math.round(a.x + (b.x - a.x) * k / n), Math.round(a.y + (b.y - a.y) * k / n), PATH_HALF, rune.ink);
  }
  const rnd = seeded(1 + Math.floor(Math.random() * 1e6)), crack = [];
  for (let y = BOOK.y + 9; y <= BOOK.y + 93; y += 7) crack.push({ x: 92 + rnd() * 48, y });   // stays above the status text
  en = { rune, phase: 'open', t: 0, left: TRACE_TIME, seg: 0, tracing: false, trail: [], devSum: 0, devN: 0,
         strength: 0, ok: false, skipped: false, gemLook: null, band, crack, reason: '' };
  state = 'enchant';
  sfx.bookOpen();
}

function enchantDown(p) {
  if (en.phase !== 'trace' || en.tracing) return;
  const s = dotPos(en.rune.path[0]);
  if (Math.hypot(p.x - s.x, p.y - s.y) <= 6) { en.tracing = true; en.seg = 0; en.trail = [p]; sfx.rune(0); }
}
function enchantMove(p) {
  if (!en || !en.tracing) return;
  const path = en.rune.path, last = en.trail[en.trail.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) >= 0.75) en.trail.push(p);
  let a = dotPos(path[en.seg]), b = dotPos(path[en.seg + 1]);
  let d = distSeg(p, a, b);
  // a fast flick can skip past a corner between two pointer samples: if we were near the corner
  // and are now on the next stroke, count the corner as reached
  if (d > PATH_HALF && en.seg + 2 < path.length && Math.hypot(last.x - b.x, last.y - b.y) < 10) {
    const c = dotPos(path[en.seg + 2]), d2 = distSeg(p, b, c);
    if (d2 <= PATH_HALF) { en.seg++; sfx.rune(en.seg); a = b; b = c; d = d2; }
  }
  if (d > PATH_HALF) return enchantFail('LEFT THE PATH');
  en.devSum += d; en.devN++;
  if (Math.hypot(p.x - b.x, p.y - b.y) <= 3.5) {
    en.seg++; sfx.rune(en.seg);
    if (en.seg >= path.length - 1) enchantSuccess();
  }
}
function enchantUp() { if (en && en.tracing && en.phase === 'trace') enchantFail('LET GO TOO SOON'); }

function enchantSuccess() {
  const avg = en.devSum / Math.max(1, en.devN);       // average distance from the ideal line
  en.strength = avg <= 1.3 ? 2 : avg <= 2.4 ? 1 : 0;
  en.tracing = false; en.ok = true; en.phase = 'success'; en.t = 0; en.gemLook = en.rune;
  const e = dotPos(en.rune.path[en.rune.path.length - 1]);

}
function enchantFail(reason) {
  en.tracing = false; en.ok = false; en.reason = reason; en.phase = 'fail'; en.t = 0; en.gemLook = 'cracked';
  const p = en.trail[en.trail.length - 1] || dotPos(en.rune.path[0]);

}
function enchantSkip() {
  if (en.phase !== 'open' && en.phase !== 'trace') return;

}

function updateEnchant(dt) {
  en.t += dt;
  if (en.phase === 'open') { if (en.t >= 0.6) { en.phase = 'trace'; en.t = 0; } }
  else if (en.phase === 'trace') { en.left -= dt; if (en.left <= 0) enchantFail('TOO SLOW'); }
  else if (en.phase === 'success' || en.phase === 'fail') { if (en.t >= 1.2) { en.phase = 'close'; en.t = 0; } }
  else if (en.phase === 'close') {

function drawEnchant() {

// ---------- story intro ----------
// Three frames before the title. Space/tap finishes the line, then moves on; Esc (or the SKIP corner) skips.
const STORY = [
  { scene: 'village', textAt: 'bottom', cue: 'wind',
    text: 'BENEATH THE MOUNTAIN LIES EMBERHOLD, A VILLAGE OF SMITHS. FOR A HUNDRED YEARS ITS FORGES NEVER WENT COLD.' },
  { scene: 'beasts', textAt: 'bottom', cue: 'dread',
    text: 'THEN THE MOON WENT DARK. FROM THE MARSH AND THE GRAVES CAME THE BEASTS, AND ONE BY ONE THE FORGES FELL SILENT.' },
  { scene: 'forge', textAt: 'top', cue: 'clang',
    text: 'ONE SMITH REMAINS. BUILD YOUR WEAPON TRUE, FOR A CROOKED BLADE WILL NOT SAVE US.' }
];

const ENDING = [
  { scene: 'dawn', textAt: 'bottom', cue: 'dawn',

];
const TYPE_CPS = 32;                 // typewriter speed, characters per second
const st = { seq: STORY, idx: 0, t: 0, begun: false, shown: 0, fade: 1, fadeDir: -1, next: null, hammerT: 0, eyesLit: 0 };

function storyTyped() { return Math.min(st.seq[st.idx].text.length, Math.floor(Math.max(0, st.t - 0.3) * TYPE_CPS)); }
function storyCue(i) {
  st.idx = i; st.t = 0; st.shown = 0; st.eyesLit = 0; st.hammerT = 0.2;
  const c = st.seq[i].cue;
  if (c === 'wind') sfx.wind(); else if (c === 'dread') sfx.dread(); else if (c === 'dawn') sfx.dawn();
}
function playEnding() {
  slain.clear();                                   // the hunt starts over after the ending
  sparks = []; popups = [];
  Object.assign(st, { seq: ENDING, idx: 0, begun: true, fade: 1, fadeDir: -1, next: null });
  state = 'story';
  storyCue(0);
}
function fadeThen(fn) { if (st.fadeDir !== 1) { st.fadeDir = 1; st.next = fn; } }
function enterTitle() { sparks = []; state = 'title'; titleFade = 1; }
function storyAdvance() {
  if (!st.begun) { st.begun = true; storyCue(0); return; }   // first press: unlocks audio, starts the story
  if (st.fadeDir === 1) return;
  if (storyTyped() < st.seq[st.idx].text.length) { st.t = 99; return; }   // finish the line first
  fadeThen(() => { if (st.idx < st.seq.length - 1) storyCue(st.idx + 1); else enterTitle(); });
}
function storySkip() { fadeThen(enterTitle); }

function updateStory(dt) {
  if (st.fadeDir) {
    st.fade += st.fadeDir * dt / 0.4;
    if (st.fade <= 0) { st.fade = 0; st.fadeDir = 0; }
    else if (st.fade >= 1) { st.fade = 1; st.fadeDir = -1; const f = st.next; st.next = null; if (f) f(); }
  }
  if (!st.begun || state !== 'story') return;
  st.t += dt;
  const text = st.seq[st.idx].text, n = storyTyped();
  if (n > st.shown) { if (text[n - 1] !== ' ' && n % 2) sfx.tick(); st.shown = n; }
  const scene = st.seq[st.idx].scene;
  if (scene === 'beasts') {                       // eyes open one by one
    const lit = Math.min(ENEMY_SPRITES.length, Math.max(0, Math.floor((st.t - 0.8) / 0.45) + 1));
    if (lit > st.eyesLit) { st.eyesLit = lit; sfx.eye(); }
  } else if (scene === 'forge') {                 // the last smith, hammering
    st.hammerT -= dt;
    if (st.hammerT <= 0) {
      st.hammerT = 1.3; shake = 1.5;
      sfx.clang(0.95);

}

// deterministic random, so scenery stays put between frames
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
// dithered vertical gradient through a list of colours (2x2 Bayer pattern keeps it pixel-art)
function ditherSky(g, cols, h) {
  const bayer = [0, 0.5, 0.75, 0.25];
  for (let y = 0; y < h; y++) {
    const t = y / h * (cols.length - 1), i = Math.floor(t), f = t - i;
    for (let x = 0; x < W; x++) {
      g.fillStyle = cols[Math.min(cols.length - 1, f > bayer[(x & 1) + (y & 1) * 2] ? i + 1 : i)];
      g.fillRect(x, y, 1, 1);
    }
  }
}
function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = -r; y <= r; y++) { const hw = Math.round(Math.sqrt(r * r - y * y)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function ring(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let a = 0; a < 360; a += 2) g.fillRect(Math.round(cx + Math.cos(a * Math.PI / 180) * r), Math.round(cy + Math.sin(a * Math.PI / 180) * r), 1, 1);
}
const MOON = { x: 116, y: 38, r: 13 };
const HORIZON = 168;

// Emberhold, at night (story frame 1) or at dawn (the ending, once every beast is slain)
function makeVillage(dawn) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), rnd = seeded(7);
  const P = dawn
    ? { sky: ['#2a1a48', '#5a2a62', '#a04a66', '#e07a52', '#f6b862'], far: '#4a2a4e', snow: '#f0c8b0', near: '#2c1a34', ground: '#1a1020',
        house: '#3a2436', shade: '#2a1a2a', roof: '#2e1c2c', lit: '#e8a070', unlit: '#5a3a4a' }
    : { sky: ['#07061a', '#0d0b26', '#1a1238', '#2c1a44', '#3d2248'], far: '#1c1530', snow: '#6b6385', near: '#120d1e', ground: '#0a0712',
        house: '#1d1529', shade: '#150f1f', roof: '#171020', lit: '#3a2c4c', unlit: '#2a2038' };
  ditherSky(g, P.sky, HORIZON);
  const far = x => 112 - 42 * Math.exp(-(((x - 55) / 30) ** 2)) - 16 * Math.exp(-(((x - 122) / 24) ** 2)) + Math.sin(x * 0.7) * 1.5;
  const near = x => 142 - 16 * Math.exp(-(((x - 132) / 22) ** 2)) - 10 * Math.exp(-(((x - 18) / 18) ** 2)) + Math.sin(x * 1.3);
  const stars = [];
  if (dawn) {                                                       // the sun, rising behind the ridge
    ring(g, MOON.x, 84, 19, '#f4a060'); ring(g, MOON.x, 84, 16, '#ffd28a');
    disc(g, MOON.x, 84, 12, '#fff0c0');
  } else {
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * 100);
      if (y < far(x) - 3 && Math.hypot(x - MOON.x, y - MOON.y) > MOON.r + 4) stars.push({ x, y, p: rnd() * 6.28 });
    }
    ring(g, MOON.x, MOON.y, MOON.r + 3, '#4a3360');
    disc(g, MOON.x, MOON.y, MOON.r, '#f4e8c8');
    disc(g, MOON.x + 4, MOON.y - 3, 3, '#dccca4'); disc(g, MOON.x - 5, MOON.y + 4, 2, '#dccca4'); disc(g, MOON.x + 2, MOON.y + 7, 1, '#dccca4');
  }
  for (let x = 0; x < W; x++) {
    const yf = Math.round(far(x));

    if (yf < 84) px(g, x, yf, 1, Math.max(1, Math.round((84 - yf) / 4)), P.snow);   // snow on the peak
    const yn = Math.round(near(x));

  const windows = [], chimneys = [];
  [[6, 18, 12], [28, 14, 10], [48, 22, 14], [76, 16, 11], [98, 20, 13], [124, 16, 10], [144, 14, 12]].forEach(([x, w, h], i) => {
    const base = 164, top = base - h;
    px(g, x, top, w, h, P.house);
    px(g, x + w - 2, top, 2, h, P.shade);                                                                 // shaded side
    const rh = Math.ceil(w / 2) + 1;
    for (let r = 0; r < rh; r++) {                                                                         // roof, lit edge
      px(g, x - 2 + r, top - r, w + 4 - r * 2, 1, P.roof);

}
const village = makeVillage(false), dawnVillage = makeVillage(true);

}

// splits text into lines of at most max characters, on spaces
function wrapText(text, max) {
  const lines = []; let line = '';
  for (const word of text.split(' ')) {
    if (line && (line + ' ' + word).length > max) { lines.push(line); line = word; }
    else line = line ? line + ' ' + word : word;
  }
  if (line) lines.push(line);
  return lines;
}

function renderStory() {
  const f = st.seq[st.idx];
  if (f.scene === 'village') drawVillage();
  else if (f.scene === 'dawn') drawVillage(dawnVillage);
  else if (f.scene === 'beasts') drawBeasts();
  else drawForgeScene();
  for (const s of sparks) px(ctx, s.x, s.y, 1, 1, s.col);

  const top = f.textAt === 'top';
  if (!top) {                                                       // caption panel
    ctx.globalAlpha = 0.88; px(ctx, 0, 176, W, H - 176, '#07050a'); ctx.globalAlpha = 1;
    px(ctx, 0, 176, W, 1, '#3a2a30');
  }
  const y0 = top ? 34 : 186;
  const lines = wrapText(f.text, 36);
  if (!st.begun) {
    drawText('EMBERHOLD', 80, 112, C.accent, 2, 'center');
    if (blink()) drawText('SPACE / TAP TO BEGIN', 80, y0 + 12, C.text, 1, 'center');
  } else {
    let left = storyTyped();
    lines.forEach((ln, i) => {
      const s = ln.slice(0, Math.max(0, left));
      left -= ln.length + 1;
      if (s) drawText(s, 8, y0 + i * 9, C.text);
    });
    const done = storyTyped() >= f.text.length;
    if (f.scene === 'dawn' && done) drawText('THE END', 80, 120, C.accent, 2, 'center');
    if (done && blink()) {
      const last = st.idx === st.seq.length - 1;
      drawText(last && st.seq === STORY ? 'SPACE TO FORGE >' : 'SPACE >', W - 8, top ? y0 + lines.length * 9 + 6 : 228, C.accent, 1, 'right');
    }
    for (let i = 0; i < st.seq.length; i++)                        // progress dots
      px(ctx, 8 + i * 6, top ? y0 + lines.length * 9 + 8 : 230, 3, 3, i === st.idx ? C.accent : '#4a3a40');
    drawText('ESC: SKIP', W - 4, 4, C.dim, 1, 'right', false);
  }
  if (st.fade > 0) { ctx.globalAlpha = st.fade; px(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
